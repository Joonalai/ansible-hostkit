---
namespace: joonalai
name: hostkit
version: 0.1.0
readme: README.md
authors:
  - Joonalai
description: >-
  Roles for self-hosted Debian servers: rootless podman accounts, ephemeral
  CI runners, GitHub Actions runners for Claude Code, and the workbench
  Claude Code's team works in. The host provides its own hardening.
license:
  - MIT
tags: [linux, infrastructure, podman, github, ci, claude]
dependencies:
  community.general: ">=10.0.0"
repository: https://github.com/Joonalai/ansible-hostkit
issues: https://github.com/Joonalai/ansible-hostkit/issues
build_ignore:
  - .agents
  - .claude
  - .venv
  - .ansible
  - .copier-answers.agent-instructions.yml
  - uv.lock
  - "*.pyc"
  - __pycache__
  - .pytest_cache
  - "**/tests"
