---
# Every role on the dev container, as a consumer would apply them, with
# what a test container cannot do turned off: no token, no App, no login.
# `make converge TAGS=executor` runs one role's play (Makefile).

- name: Stand in for the host's hardening
  hosts: hostkit-dev
  tags: [always]
  tasks:
    # Even in a dry run: it stands in for what the host has before any of
    # these roles runs.
    - name: Install a sandbox unit that fences nothing
      check_mode: false
      ansible.builtin.copy:
        dest: "/etc/systemd/system/{{ dev_sandbox_unit }}"
        content: |
          # The dev container's stand-in for the host's sandbox: the roles
          # require one, and a real host's firewall rules sit behind it.
          # This one holds nothing off.
          [Unit]
          Description=Stand-in for the host's sandbox, fencing nothing

          [Service]
          Type=oneshot
          RemainAfterExit=yes
          ExecStart=/bin/true

          [Install]
          WantedBy=multi-user.target
        owner: root
        group: root
        mode: "0644"
      become: true

    - name: Start the sandbox unit
      check_mode: false
      ansible.builtin.systemd_service:
        name: "{{ dev_sandbox_unit }}"
        state: started
        enabled: true
        daemon_reload: true
      become: true

- name: The executor
  hosts: hostkit-dev
  tags: [executor, github_runner, workbench]
  roles:
    - role: joonalai.hostkit.executor
      vars:
        executor_instances:
          - name: stacks
            exec_uid: 2101
            exec_subuid_start: "{{ dev_exec_subuid_start }}"
            exec_subuid_count: "{{ dev_exec_subuid_count }}"
            sandbox_units: ["{{ dev_sandbox_unit }}"]
            ports_start: 9300
            ports_end: 9339
            host: hostkit-dev.example.ts.net
            memory_max: 2G
            cpu_weight: 20
            disk_max_gb: 5
            # One place of the three for people: the smoke test's second
            # person finds no room.
            waiting_reserve: 2
            # The caller container, and an address no container has.
            remote: true
            # The smoke test's stalled request is cut off in seconds.
            remote_timeout_seconds: 5
            remote_callers:
              - name: remote-smoke
                key_sha256: "{{ dev_remote_key | hash('sha256') }}"
                repos: [example/smoke]
                from: [192.0.2.20/32]
              - name: remote-elsewhere
                key_sha256: "{{ dev_remote_other_key | hash('sha256') }}"
                repos: [example/smoke]
                from: [192.0.2.99/32]
            # smoke_other is another repository's: the smoke stack asks for
            # it and gets it empty.
            secrets:
              values:
                smoke_key: "{{ dev_smoke_secret }}"
                smoke_other: another-repositorys-value
              repositories:
                example/smoke: [smoke_key]
                example/app: [smoke_other]

- name: The CI runner
  hosts: hostkit-dev
  tags: [ci_runner]
  roles:
    - role: joonalai.hostkit.ci_runner
      vars:
        ci_runner_account_uid: 2201
        ci_runner_sandbox_unit: "{{ dev_sandbox_unit }}"
        ci_runner_repos: [example/app]
        # Made up, and opens nothing: the dev container never starts the
        # dispatcher (is_container_environment), which is what would use it.
        ci_runner_github_token: dev-container-opens-nothing

- name: The GitHub runner
  hosts: hostkit-dev
  tags: [github_runner]
  roles:
    - role: joonalai.hostkit.github_runner
      vars:
        github_runner_uid: 2001
        github_runner_sandbox_units: ["{{ dev_sandbox_unit }}"]
        github_runner_start: false
        github_runner_runners: 1
        github_runner_job_env:
          PYTEST_XDIST_AUTO_NUM_WORKERS: 2
        github_runner_repos:
          - name: app
            repo: example/app
            port_base: 9100
            executor: stacks
  post_tasks:
    - name: Read the slot's unit
      when: not ansible_check_mode
      ansible.builtin.slurp:
        src: /home/coder/.config/containers/systemd/github-runner-app-1.container
      register: dev_runner_unit
      become: true

    - name: Find the jobs' environment in the slot's unit
      when: not ansible_check_mode
      ansible.builtin.assert:
        that: (dev_runner_unit.content | b64decode) is search('(?m)^Environment="PYTEST_XDIST_AUTO_NUM_WORKERS=2"$')
        fail_msg: github_runner_job_env did not reach the slot's unit.
        quiet: true

    # The preview is the roles' alone: nothing a job writes on GitHub names
    # its address, the PR's "Try it" and the tester's line included.
    - name: Read the slot's rendered rules, lead text and preview skill
      when: not ansible_check_mode
      ansible.builtin.slurp:
        src: /home/coder/claude/app-1/{{ item }}
      loop: [CLAUDE.md, lead.md, skills/preview/SKILL.md]
      register: dev_runner_rules
      become: true

    - name: Find no ask for the preview's address in the PR
      when: not ansible_check_mode
      ansible.builtin.assert:
        that: dev_runner_rules_text is not search('preview at http|preview.s address|Say where it is|user the\\s+other|exception, since they are how the user')
        fail_msg: "{{ item.item }} still asks for the preview's address in the PR."
        quiet: true
      vars:
        dev_runner_rules_text: "{{ item.content | b64decode }}"
      loop: "{{ dev_runner_rules.results }}"
      loop_control:
        label: "{{ item.item }}"

- name: The workbench
  hosts: hostkit-dev
  tags: [workbench]
  vars:
    claude_code_user: bench
    # The instance above, as a remote one: lib's registration goes the
    # remote way, with the certificate the executor's play made.
    executor_remote_instances:
      - name: far
        url: tls://hostkit-dev:9300
        tls_sha256: "{{ dev_tls_fingerprint.stdout | default('') | split('=') | last | replace(':', '') | lower }}"
    claude_code_uid: 2002
    claude_code_update_restarts: ""
    claude_code_settings: "{{ workbench_claude_settings }}"
    claude_code_login_required: false
  pre_tasks:
    - name: Read the instance's certificate, for its remote callers
      ansible.builtin.command:
        argv: [openssl, x509, -noout, -fingerprint, -sha256, -in, /etc/hostkit-executor/stacks/tls.crt]
      register: dev_tls_fingerprint
      changed_when: false
      check_mode: false
      failed_when: dev_tls_fingerprint.rc != 0 and not ansible_check_mode
      become: true
  roles:
    - role: joonalai.hostkit.claude_code
    - role: joonalai.hostkit.workbench
      vars:
        workbench_uid: 2002
        workbench_sandbox_units: ["{{ dev_sandbox_unit }}"]
        workbench_git_name: Example User
        workbench_git_email: 1234567+example@users.noreply.github.com
        workbench_tokens_required: false
        # app opts into gpu-models and lib does not. No model server here:
        # the env file is checked, not a call.
        workbench_gpu_models_url: http://192.0.2.1:9180/v1
        workbench_gpu_models_info_url: http://192.0.2.1:9181/manifest
        workbench_gpu_models_api_key: dev-key
        workbench_repositories:
          - name: app
            repo: example/app
            executor: stacks
            skills: [gpu-models]
          - name: lib
            repo: example/lib
            executor: far
        workbench_try:
          - instance: stacks
            repos:
              - example/smoke
              - repo: example/app
                instructions: |
                  Open the page first.
          - instance: far
            repos: [example/lib]
  post_tasks:
    - name: Look for the gpu-models files
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/bench/.claude/skills/gpu-models/SKILL.md
        - /home/bench/.config/workbench/app-gpu-models.env
        - /home/bench/.config/workbench/lib-gpu-models.env
      register: dev_gpu_files
      when: not ansible_check_mode
      become: true

    - name: Read the containers' units
      ansible.builtin.slurp:
        src: /home/bench/.config/containers/systemd/workbench-{{ item }}.container
      loop: [app, lib]
      register: dev_gpu_units
      when: not ansible_check_mode
      become: true

    - name: Give the gpu-models skill to all, and its key to app alone
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - dev_gpu_files.results[0].stat.exists
          - dev_gpu_files.results[1].stat.exists
          - dev_gpu_files.results[1].stat.mode == '0600'
          - not dev_gpu_files.results[2].stat.exists
          - "'app-gpu-models.env' in (dev_gpu_units.results[0].content | b64decode)"
          - "'gpu-models.env' not in (dev_gpu_units.results[1].content | b64decode)"
        quiet: true

    - name: Read the tries the try skill reads
      ansible.builtin.slurp:
        src: /home/bench/.config/workbench/try.json
      register: dev_try_json
      when: not ansible_check_mode
      become: true

    - name: Find each try's repositories by name, and app's instructions
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - dev_tries[0].repos == ['example/smoke', 'example/app']
          - dev_tries[0].instructions | list == ['example/app']
          - dev_tries[0].instructions['example/app'] | trim == 'Open the page first.'
          - dev_tries[1].repos == ['example/lib']
          - dev_tries[1].instructions == {}
        fail_msg: "{{ dev_tries | to_json }}"
        quiet: true
      vars:
        dev_tries: "{{ dev_try_json.content | b64decode | from_json }}"

- name: Gatus
  hosts: hostkit-dev
  tags: [gatus]
  roles:
    - role: joonalai.hostkit.gatus
      vars:
        gatus_uid: 2401
        gatus_config_files:
          checks:
            endpoints:
              - name: self
                group: dev
                url: http://127.0.0.1:8080/health
                interval: 1m
                conditions: ["[STATUS] == 200"]
            external-endpoints:
              - name: heartbeat
                group: dev
                token: ${DEV_HEARTBEAT_TOKEN}
                heartbeat:
                  interval: 15m
        gatus_environment:
          DEV_HEARTBEAT_TOKEN: "{{ dev_heartbeat_token }}"
  post_tasks:
    # A heartbeat as a consumer's timer sends it, with the token from the
    # environment file: Gatus took the ${NAME} in its config.
    - name: Send a heartbeat
      when: not ansible_check_mode
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ gatus_port }}/api/v1/endpoints/dev_heartbeat/external?success=true
        method: POST
        headers:
          Authorization: Bearer {{ dev_heartbeat_token }}
      changed_when: false

    - name: Send a heartbeat with the wrong token
      when: not ansible_check_mode
      ansible.builtin.uri:
        url: http://127.0.0.1:{{ gatus_port }}/api/v1/endpoints/dev_heartbeat/external?success=true
        method: POST
        headers:
          Authorization: Bearer not-the-token
        status_code: 401
      changed_when: false

    - name: Read the config file Gatus reads and the secrets beside it
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /home/gatus/config/checks.yaml
        - /home/gatus/gatus.env
      register: dev_gatus_files
      become: true

    - name: Read the config file's text
      when: not ansible_check_mode
      ansible.builtin.slurp:
        src: /home/gatus/config/checks.yaml
      register: dev_gatus_checks
      become: true

    - name: Find the token in the environment file alone
      when: not ansible_check_mode
      ansible.builtin.assert:
        that:
          - dev_gatus_files.results[0].stat.mode == '0600'
          - dev_gatus_files.results[1].stat.mode == '0400'
          - dev_gatus_files.results[1].stat.pw_name == 'gatus'
          - dev_heartbeat_token not in (dev_gatus_checks.content | b64decode)
          - "'${DEV_HEARTBEAT_TOKEN}' in (dev_gatus_checks.content | b64decode)"
        quiet: true
