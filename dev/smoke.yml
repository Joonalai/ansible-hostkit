---
# An executor stack, end to end, on the dev container after `make converge`:
# a caller of its own, a repository with a stack.toml, then `stack up` and a
# request to the page; ups the executor must refuse, after which the page
# must still answer; then `stack run`, `list` and `logs`; an up whose
# service dies at start, which must fail with its log and keep the volume
# of the same commit; a rewritten commit, whose volume starts empty; and
# `down`. The stack is given a secret, which its service sees and nothing
# else shows: not the up's output, its logs, the journal or its image.

- name: Bring a stack up and down on the executor
  hosts: hostkit-dev
  vars:
    dev_smoke_repo: /root/smoke
    dev_smoke_env: /root/smoke.env
    dev_smoke_socket: /run/hostkit-executor/stacks/api.sock
    # Alpine rather than busybox: busybox's /home is nobody's, 65534, past
    # the dev container's ID range (inventory.yml).
    dev_smoke_image: docker.io/library/alpine:3.22@sha256:9db2934886712d877c932e07249c75a59e6ca27adfbccc05261987a17bef2d63
  tasks:
    - name: Install the stack command
      ansible.builtin.include_role:
        name: joonalai.hostkit.executor
        tasks_from: client
      vars:
        executor_client_dest: /usr/local/bin/stack

    - name: Register root as a caller of the instance
      ansible.builtin.include_role:
        name: joonalai.hostkit.executor
        tasks_from: callers
      vars:
        executor_callers_prefix: dev-
        executor_callers:
          - instance: stacks
            name: dev-smoke
            uid: 0
            repos: [example/smoke]
            waits: false
            env_file: "{{ dev_smoke_env }}"
            env_mode: "0600"
            local_host: 127.0.0.1

    - name: Make the repository's directory
      ansible.builtin.file:
        path: "{{ dev_smoke_repo }}/site"
        state: directory
        owner: root
        group: root
        mode: "0755"
      become: true

    - name: Write the repository's files
      ansible.builtin.copy:
        dest: "{{ dev_smoke_repo }}/{{ item.name }}"
        content: "{{ item.content }}"
        owner: root
        group: root
        mode: "0644"
      loop:
        - name: compose.yaml
          content: |
            services:
              web:
                image: {{ dev_smoke_image }}
                command:
                  - sh
                  - -c
                  - while true; do { printf 'HTTP/1.0 200 OK\r\n\r\n'; cat /srv/index.html; } | nc -l -p 8000; done
                volumes: ["./site:/srv:ro"]
                ports: ["${BIND}:${WEB_PORT}:8000"]
                security_opt: ["no-new-privileges:true"]
              # A one-shot service the next waits for, as migrations are.
              # Its volume is kept for the same commit, and new for another.
              seed:
                image: {{ dev_smoke_image }}
                command: ["true"]
                volumes: ["data:/data"]
              # A one-shot service no other waits for: its status 0 is fine.
              job:
                image: {{ dev_smoke_image }}
                command: ["true"]
              # Built from the tree, its files read by a user not root: the
              # checkout's modes are what COPY puts in the image.
              # The image name is the file's: the executor builds it as the
              # stack's own, stack-<caller>-app.
              # It is given the secret, and prints only its hash.
              app:
                build: {context: ., dockerfile: Containerfile.app}
                image: smoke-app
                environment: {SMOKE_KEY: "${SMOKE_KEY}"}
                command:
                  - sh
                  - -c
                  - cat /app/site/index.html && echo "key-sha256 $$(printf %s "$$SMOKE_KEY" | sha256sum)" && exec sleep 3600
                depends_on: {seed: {condition: service_completed_successfully}}
              # The same build as app's: built after it, it is app's image.
              worker:
                build: {context: ., dockerfile: Containerfile.app}
                command: ["sleep", "3600"]
              # app's image, by the name the file gives it.
              helper:
                image: smoke-app
                command: ["sleep", "3600"]
              # Turned on by the profile, and set up the way a repository
              # whose .env is a copy of .env.example is.
              extra:
                image: {{ dev_smoke_image }}
                profiles: [extra]
                env_file: .env
                command: ["sh", "-c", "echo \"greeting: $$SMOKE_GREETING\"; sleep 3600"]
              # Not turned on: its writable mount refuses nothing.
              docs:
                image: {{ dev_smoke_image }}
                profiles: [docs]
                volumes: ["./site:/srv"]
            volumes:
              data: {}
        - name: Containerfile.app
          content: |
            FROM {{ dev_smoke_image }}
            COPY build-nonce /app/build-nonce
            RUN sleep 3
            COPY site /app/site
            COPY . /app/tree
            USER 1000
        - name: compose.broken.yaml
          content: |
            services:
              app:
                command: ["sh", "-c", "echo smoke app broken at start; exit 3"]
        - name: compose.foreign.yaml
          content: |
            services:
              web:
                image: stack-other-web
        - name: compose.privileged.yaml
          content: |
            services:
              web:
                privileged: true
        - name: compose.profiled.yaml
          content: |
            services:
              hidden:
                image: {{ dev_smoke_image }}
                profiles: [later]
                privileged: true
        - name: compose.writable.yaml
          content: |
            services:
              web:
                volumes: ["./site:/srv"]
        - name: compose.home.yaml
          content: |
            services:
              web:
                env_file: [/home/stacks-exec/smoke-secret]
        - name: stack.toml
          content: |
            [profiles.default]
            compose = ["compose.yaml"]
            compose_profiles = ["extra"]
            page = 1

            [profiles.default.env]
            WEB_PORT = "{port1}"
            BIND = "{bind}"
            SMOKE_GREETING = "hello from the profile"
            SMOKE_KEY = "{secret:smoke_key}"
            SMOKE_OTHER = "{secret:smoke_other}"

            {% for name in ['privileged', 'profiled', 'writable', 'home', 'foreign', 'broken'] %}
            [profiles.{{ name }}]
            compose = ["compose.yaml", "compose.{{ name }}.yaml"]
            compose_profiles = {{ '["later"]' if name == 'profiled' else '[]' }}
            page = 1
            env = { WEB_PORT = "{port1}", BIND = "{bind}" }
            {% endfor %}

            [suites.check]
            service = "web"
            command = ["wget", "-qO-", "http://web:8000/"]
      loop_control:
        label: "{{ item.name }}"
      become: true

    - name: Write the page it serves
      ansible.builtin.copy:
        dest: "{{ dev_smoke_repo }}/site/index.html"
        content: "hostkit smoke\n"
        owner: root
        group: root
        mode: "0644"
      become: true

    # New on every run, so the image is built, not found in the cache:
    # built at once, app's and worker's would be two images.
    - name: Write a nonce the image copies
      ansible.builtin.copy:
        dest: "{{ dev_smoke_repo }}/build-nonce"
        content: "{{ now().timestamp() }}\n"
        owner: root
        group: root
        mode: "0644"
      changed_when: false
      become: true

    - name: Commit the repository
      ansible.builtin.shell:
        cmd: |
          set -eu
          [ -d .git ] || git init -q -b main
          git add -A
          git -c user.name=smoke -c user.email=smoke@example.com commit -q -m smoke || true
          git rev-parse HEAD
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      changed_when: false
      become: true

    - name: Look up the exec account's uid
      ansible.builtin.command:
        argv: [id, -u, stacks-exec]
      register: dev_smoke_exec_uid
      changed_when: false

    # A run that failed midway left its stack, whose volume the next run's
    # commit, on top of that one's, would keep.
    - name: Take down a stack an earlier run left
      ansible.builtin.shell:
        cmd: set -a && . {{ dev_smoke_env }} && STACK_SOCKET={{ dev_smoke_socket }} stack down
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      changed_when: true
      failed_when: false
      become: true

    - name: Bring the stack up
      ansible.builtin.shell:
        cmd: set -a && . {{ dev_smoke_env }} && STACK_SOCKET={{ dev_smoke_socket }} stack up --json
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      register: dev_smoke_up
      changed_when: true
      failed_when: >-
        dev_smoke_up.rc != 0 or (dev_smoke_up.stdout | from_json).volumes != 'new'
        or 'left empty: smoke_other.' not in dev_smoke_up.stderr
        or dev_smoke_secret in dev_smoke_up.stdout + dev_smoke_up.stderr
      become: true

    - name: Find the secret's hash, and not the secret, in app's logs
      ansible.builtin.shell:
        cmd: set -a && . {{ dev_smoke_env }} && STACK_SOCKET={{ dev_smoke_socket }} stack logs app
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      register: dev_smoke_key_logs
      changed_when: false
      failed_when: >-
        dev_smoke_key_logs.rc != 0
        or ('key-sha256 ' ~ (dev_smoke_secret | hash('sha256'))) not in dev_smoke_key_logs.stdout + dev_smoke_key_logs.stderr
        or dev_smoke_secret in dev_smoke_key_logs.stdout + dev_smoke_key_logs.stderr
      become: true

    # The tree's .env is in the build's context, and the stack's env
    # without its secrets: COPY . put it in the image, and not the secret.
    # no_log, since a module logs its arguments to the journal, the secret
    # among them here.
    - name: Find the tree's .env in app's image, without the secret
      ansible.builtin.command:
        argv: [runuser, -u, stacks-exec, --, env, "XDG_RUNTIME_DIR=/run/user/{{ dev_smoke_exec_uid.stdout }}",
               podman, run, --rm, stack-dev-smoke-app, sh, -c,
               'grep -q "^WEB_PORT=" /app/tree/.env && ! grep -rqF -- "$0" /app', "{{ dev_smoke_secret }}"]
      register: dev_smoke_image_env
      changed_when: false
      no_log: true
      become: true

    # no_log, so a failure does not print the journal: look for the value
    # in it with journalctl on the host.
    - name: Find no secret in the journal
      ansible.builtin.command:
        argv: [journalctl, --no-pager, --quiet, --since, -1h]
      register: dev_smoke_journal
      changed_when: false
      failed_when: dev_smoke_journal.rc != 0 or dev_smoke_secret in dev_smoke_journal.stdout
      no_log: true
      become: true

    - name: Ask the page
      ansible.builtin.uri:
        url: "{{ (dev_smoke_up.stdout | from_json).local }}"
        return_content: true
      register: dev_smoke_page
      retries: 10
      delay: 2
      until: dev_smoke_page.status == 200
      failed_when: "'hostkit smoke' not in dev_smoke_page.content"

    - name: Find when the stack's volume was made
      ansible.builtin.command:
        argv: &dev_smoke_volume_created
          [runuser, -u, stacks-exec, --, env, "XDG_RUNTIME_DIR=/run/user/{{ dev_smoke_exec_uid.stdout }}",
           podman, volume, inspect, --format, "{{ '{{' }}.CreatedAt{{ '}}' }}", stack-dev-smoke_data]
      register: dev_smoke_volume
      changed_when: false
      become: true

    - name: Find the images of the services with app's build or its image
      ansible.builtin.command:
        argv: [runuser, -u, stacks-exec, --, env, "XDG_RUNTIME_DIR=/run/user/{{ dev_smoke_exec_uid.stdout }}",
               podman, inspect, --format, "{{ '{{' }}.Image{{ '}}' }} {{ '{{' }}.ImageName{{ '}}' }}",
               stack-dev-smoke-app-1, stack-dev-smoke-worker-1, stack-dev-smoke-helper-1]
      register: dev_smoke_images
      changed_when: false
      failed_when: >-
        dev_smoke_images.rc != 0
        or dev_smoke_images.stdout_lines | map('split') | map('first') | unique | length != 1
        or 'smoke-app' in dev_smoke_images.stdout | replace('stack-dev-smoke-app', '')
      become: true

    # A file of the exec account's that no stack may read: its home is out
    # of sight while the agent reads the compose files.
    - name: Leave a file in the exec account's home
      ansible.builtin.copy:
        dest: /home/stacks-exec/smoke-secret
        content: "SMOKE_SECRET=leaked\n"
        owner: stacks-exec
        group: stacks-exec
        mode: "0600"
      become: true

    - name: Fail to bring up the stacks that reach past themselves
      ansible.builtin.shell:
        cmd: set -a && . {{ dev_smoke_env }} && STACK_SOCKET={{ dev_smoke_socket }} stack up --profile {{ item.profile }}
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      loop:
        - {profile: privileged, says: "web: privileged"}
        - {profile: profiled, says: "hidden: privileged"}
        - {profile: writable, says: "not read-only"}
        - {profile: home, says: "smoke-secret"}
        - {profile: foreign, says: "web: the image stack-other-web"}
      loop_control:
        label: "{{ item.profile }}"
      register: dev_smoke_refused
      changed_when: false
      failed_when: dev_smoke_refused.rc == 0 or item.says not in dev_smoke_refused.stderr or 'leaked' in dev_smoke_refused.stderr
      become: true

    # A refused up replaces nothing: the stack above still answers.
    - name: Ask the page again, after the refused ups
      ansible.builtin.uri:
        url: "{{ (dev_smoke_up.stdout | from_json).local }}"
        return_content: true
      register: dev_smoke_page_again
      retries: 10
      delay: 2
      until: dev_smoke_page_again.status == 200
      failed_when: "'hostkit smoke' not in dev_smoke_page_again.content"

    - name: Run the suite, list the stacks and show the logs
      ansible.builtin.shell:
        cmd: set -a && . {{ dev_smoke_env }} && STACK_SOCKET={{ dev_smoke_socket }} stack {{ item }}
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      loop: [run check, list, logs web, logs extra]
      register: dev_smoke_calls
      changed_when: false
      failed_when: >-
        dev_smoke_calls.rc != 0
        or (item == 'run check' and 'hostkit smoke' not in dev_smoke_calls.stdout + dev_smoke_calls.stderr)
        or (item == 'logs extra' and 'greeting: hello from the profile' not in dev_smoke_calls.stdout + dev_smoke_calls.stderr)
      become: true

    - name: Stop the page's service and find it named stopped
      ansible.builtin.shell:
        cmd: >-
          set -a && . {{ dev_smoke_env }} && export STACK_SOCKET={{ dev_smoke_socket }}
          && stack stop web && stack list
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      register: dev_smoke_service_stop
      changed_when: true
      failed_when: >-
        dev_smoke_service_stop.rc != 0
        or '(stopped: web)' not in dev_smoke_service_stop.stdout
      become: true

    - name: Find the page gone with its service
      ansible.builtin.uri:
        url: "{{ (dev_smoke_up.stdout | from_json).local }}"
      register: dev_smoke_page_gone
      failed_when: dev_smoke_page_gone.status == 200

    - name: Start the page's service again
      ansible.builtin.shell:
        cmd: set -a && . {{ dev_smoke_env }} && STACK_SOCKET={{ dev_smoke_socket }} stack start web
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      changed_when: true
      become: true

    - name: Ask the page after its service started again
      ansible.builtin.uri:
        url: "{{ (dev_smoke_up.stdout | from_json).local }}"
        return_content: true
      register: dev_smoke_page_back
      retries: 10
      delay: 2
      until: dev_smoke_page_back.status == 200
      failed_when: "'hostkit smoke' not in dev_smoke_page_back.content"

    # Up waits for every service: one that dies at start fails it, with
    # its log, and stops the stack.
    - name: Fail to bring up a stack whose service dies at start
      ansible.builtin.shell:
        cmd: set -a && . {{ dev_smoke_env }} && STACK_SOCKET={{ dev_smoke_socket }} stack up --profile broken
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      register: dev_smoke_broken
      changed_when: true
      failed_when: >-
        dev_smoke_broken.rc == 0
        or 'smoke app broken at start' not in dev_smoke_broken.stdout + dev_smoke_broken.stderr
        or 'The volumes are kept' not in dev_smoke_broken.stderr
      become: true

    - name: Find the volume kept for the same commit
      ansible.builtin.command:
        argv: *dev_smoke_volume_created
      register: dev_smoke_volume_kept
      changed_when: false
      failed_when: dev_smoke_volume_kept.rc != 0 or dev_smoke_volume_kept.stdout != dev_smoke_volume.stdout
      become: true

    # A rewritten commit, as after a rebase, is another branch's: its
    # stack's volumes start empty.
    - name: Rewrite the commit and bring it up
      ansible.builtin.shell:
        cmd: |
          set -eu
          git -c user.name=smoke -c user.email=smoke@example.com commit -q --amend -m smoke-rewritten
          set -a && . {{ dev_smoke_env }} && STACK_SOCKET={{ dev_smoke_socket }} stack up --json
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      register: dev_smoke_rewritten
      changed_when: true
      failed_when: dev_smoke_rewritten.rc != 0 or (dev_smoke_rewritten.stdout | from_json).volumes != 'new'
      become: true

    - name: Find the volume made anew for the rewritten commit
      ansible.builtin.command:
        argv: *dev_smoke_volume_created
      register: dev_smoke_volume_new
      changed_when: false
      failed_when: dev_smoke_volume_new.rc != 0 or dev_smoke_volume_new.stdout == dev_smoke_volume.stdout
      become: true

    - name: Take the stack down
      ansible.builtin.shell:
        cmd: set -a && . {{ dev_smoke_env }} && STACK_SOCKET={{ dev_smoke_socket }} stack down
        chdir: "{{ dev_smoke_repo }}"
        executable: /bin/bash
      changed_when: true
      become: true

    # The workbench's try is a caller of its own, with its env file in
    # bench's config; the socket is the container's path, so swap it here.
    # Only where the workbench's play ran too: CI's executor job runs the
    # executor's alone.
    - name: Find the workbench's account
      ansible.builtin.getent:
        database: passwd
        key: bench
        fail_key: false

    - name: List the stacks as the workbench's try
      ansible.builtin.command:
        argv:
          - runuser
          - -u
          - bench
          - --
          - bash
          - -c
          - set -a && . /home/bench/.config/workbench/try/stacks.env && STACK_SOCKET={{ dev_smoke_socket }} stack list --json
      register: dev_smoke_try_list
      changed_when: false
      failed_when: dev_smoke_try_list.rc != 0
      when: ansible_facts.getent_passwd.bench is not none
      become: true

# A caller on another host, over TLS: it pins the instance's certificate,
# brings the same repository up as remote-smoke, reads the page from its
# side, runs the suite and takes it down. Refused: a wrong pin, which sends
# nothing; a key registered from another address; and a request that
# stalls, which the front cuts off.
- name: Bring a stack up and down from a remote caller
  hosts: hostkit-caller
  vars:
    dev_remote_dir: /root/smoke
    dev_remote_env: >-
      STACK_URL=tls://hostkit-dev:9300 STACK_TLS_SHA256={{ dev_remote_sha256 }}
      STACK_REPO=example/smoke STACK_KEY={{ dev_remote_key }}
    dev_remote_sha256: >-
      {{ dev_remote_fingerprint.stdout.split('=')[-1] | replace(':', '') | lower }}
  pre_tasks:
    - name: Read the instance's certificate
      delegate_to: hostkit-dev
      ansible.builtin.command:
        argv: [openssl, x509, -noout, -fingerprint, -sha256, -in, /etc/hostkit-executor/stacks/tls.crt]
      register: dev_remote_fingerprint
      changed_when: false
      become: true
  tasks:
    - name: Install git, which stack bundles with
      ansible.builtin.apt:
        name: git
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Copy the stack client and the repository from the instance's host
      ansible.builtin.shell:
        cmd: |
          set -eu -o pipefail
          podman exec hostkit-caller rm -r -f -- /root/smoke
          podman exec hostkit-dev tar -C /root -c smoke | podman exec -i hostkit-caller tar -C /root -x
          install='cat > /usr/local/bin/stack && chmod 0755 /usr/local/bin/stack'
          podman exec hostkit-dev cat /usr/local/bin/stack | podman exec -i hostkit-caller sh -c "$install"
        executable: /bin/bash
      delegate_to: localhost
      changed_when: true

    - name: Bring the stack up from the remote caller
      ansible.builtin.shell:
        cmd: env {{ dev_remote_env }} stack up --json
        chdir: "{{ dev_remote_dir }}"
        executable: /bin/bash
      register: dev_remote_up
      changed_when: true
      failed_when: dev_remote_up.rc != 0

    - name: Ask the page from the remote caller's side
      ansible.builtin.uri:
        url: "http://hostkit-dev:{{ ((dev_remote_up.stdout | from_json).page | urlsplit('port')) }}/"
        return_content: true
      register: dev_remote_page
      retries: 10
      delay: 2
      until: dev_remote_page.status == 200
      failed_when: "'hostkit smoke' not in dev_remote_page.content"

    - name: Run the suite and take the stack down from the remote caller
      ansible.builtin.shell:
        cmd: env {{ dev_remote_env }} stack {{ item }}
        chdir: "{{ dev_remote_dir }}"
        executable: /bin/bash
      loop: [run check, down]
      register: dev_remote_calls
      changed_when: item == 'down'
      failed_when: dev_remote_calls.rc != 0

    - name: Fail to reach the instance with another certificate pinned
      ansible.builtin.shell:
        cmd: env {{ dev_remote_env | replace(dev_remote_sha256, '0' * 64) }} stack list
        executable: /bin/bash
      register: dev_remote_wrong_pin
      changed_when: false
      failed_when: dev_remote_wrong_pin.rc == 0 or 'nothing was sent' not in dev_remote_wrong_pin.stderr

    - name: Fail to use a key registered from another address
      ansible.builtin.shell:
        cmd: env {{ dev_remote_env | replace(dev_remote_key, dev_remote_other_key) }} stack list
        executable: /bin/bash
      register: dev_remote_elsewhere
      changed_when: false
      failed_when: dev_remote_elsewhere.rc == 0 or '192.0.2.20 may not use this key' not in dev_remote_elsewhere.stderr

    # The front waits a minute for each read, then cuts the connection.
    - name: Stall a request, which the front cuts off
      ansible.builtin.command:
        argv:
          - python3
          - -c
          - |
            import json, socket, ssl, sys, time
            context = ssl.SSLContext(ssl.PROTOCOL_TLS_CLIENT)
            context.check_hostname = False
            context.verify_mode = ssl.CERT_NONE
            header = {"key": sys.argv[1], "action": "up", "repo": "example/smoke", "bundle_size": 1000}
            with context.wrap_socket(socket.create_connection(("hostkit-dev", 9300))) as conn:
                conn.sendall(json.dumps(header).encode() + b"\n")
                conn.settimeout(90)
                started = time.monotonic()
                answer = conn.recv(65536)
                print(round(time.monotonic() - started), answer.decode(errors="replace"))
          - "{{ dev_remote_key }}"
      register: dev_remote_stalled
      changed_when: false
      failed_when: dev_remote_stalled.rc != 0 or 'timed out' not in dev_remote_stalled.stdout
