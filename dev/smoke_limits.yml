---
# One pass of smoke.yml's cap test: the account with the cap in item, and
# its cgroup read back.
- name: Set up the limits account with a cap of {{ item }}
  ansible.builtin.include_role:
    name: joonalai.hostkit.rootless_account
  vars:
    rootless_account_user: limits
    rootless_account_uid: 2301
    rootless_account_subuid_start: 64000
    rootless_account_subuid_count: 1000
    rootless_account_memory_max: "{{ item }}"
    rootless_account_sandbox_units: ["{{ dev_sandbox_unit }}"]

- name: Read the limits account's memory.max
  ansible.builtin.slurp:
    src: /sys/fs/cgroup/user.slice/user-2301.slice/user@2301.service/memory.max
  register: dev_smoke_limits_max
  become: true

- name: Find the cap of {{ item }} in the live cgroup
  ansible.builtin.assert:
    that: dev_smoke_limits_max.content | b64decode | trim | int == item | human_to_bytes
    fail_msg: memory.max is {{ dev_smoke_limits_max.content | b64decode | trim }}, not {{ item | human_to_bytes }}.
    quiet: true
