---
- name: Fail early on non-Debian targets
  ansible.builtin.assert:
    that: ansible_facts['os_family'] == 'Debian'
    fail_msg: "This role targets Debian."

- name: Merge each instance over the defaults
  ansible.builtin.set_fact:
    executor_merged: >-
      {%- set merged = [] -%}
      {%- for instance in executor_instances -%}
      {%- set _ = merged.append(executor_instance_defaults | combine(instance)) -%}
      {%- endfor -%}
      {{- merged -}}

# The callers run untrusted code through the instance: never without the
# host's sandbox, which this collection does not provide. The name becomes
# two accounts, units and directories.
- name: Assert every instance is complete and sandboxed
  ansible.builtin.assert:
    that:
      - item.name | default('') is match('^[a-z][a-z0-9]{0,15}$')
      - item.exec_uid | default('') | string is match('^[0-9]+$')
      - item.exec_subuid_start | default('') | string is match('^[0-9]+$')
      - item.sandbox_units | default([]) is not string
      - item.sandbox_units | default([]) | length > 0
      - item.ports_start | default('') | string is match('^[0-9]+$')
      - item.ports_end | default('') | string is match('^[0-9]+$')
      - item.ports_per_caller | int in range(1, 17)
      - item.ports_end | int - item.ports_start | int + 1 >= 2 + item.ports_per_caller | int
      - item.max_stacks | int >= 1
      - item.waiting_reserve | string is match('^[0-9]+$')
      - item.waiting_reserve | int < item.max_stacks | int
      - >-
        item.https_port | string | length == 0
        or (item.https_port | string is match('^[0-9]+$')
            and item.https_port | int >= 2 and item.https_port | int <= item.ports_per_caller | int)
      - item.overrides is mapping
    fail_msg: >-
      {{ item }}: an instance wants a name of a lowercase letter and up to 15
      letters and digits, exec_uid and exec_subuid_start, which the host's
      sandbox names, sandbox_units, the units of the host's own hardening
      that keep {{ item.name | default('it') }}-exec and its range off the
      host, its LAN and its private network (this collection never changes
      the firewall), ports_start..ports_end with room for the API port,
      the phone page and one block of ports_per_caller, a
      waiting_reserve below max_stacks, and an https_port, if any, from 2
      to ports_per_caller, since the host's proxy forwards to the first.
    quiet: true
  loop: "{{ executor_merged }}"
  loop_control:
    label: "{{ item.name | default(item) }}"

# The values never in a message: the facts name only what is wrong with
# them, and the assert prints those names.
# A remote caller has no uid: its key and the networks it connects from
# are all that stand for it, so each is checked here.
- name: Assert every instance's remote callers are complete
  ansible.builtin.assert:
    that:
      - item.remote | bool or item.remote_callers | length == 0
      - item.remote_callers is not string
      - item.remote_callers | rejectattr('name', 'match', '^remote-[a-z0-9][a-z0-9-]{0,55}$') | list | length == 0
      - item.remote_callers | rejectattr('key_sha256', 'match', '^[0-9a-f]{64}$') | list | length == 0
      - item.remote_callers | selectattr('repos', 'string') | list | length == 0
      - item.remote_callers | rejectattr('from', 'defined') | list | length == 0
      - item.remote_callers | selectattr('from', 'string') | list | length == 0
      - item.remote_callers | rejectattr('from') | list | length == 0
      - item.remote_callers | map(attribute='name') | unique | length == item.remote_callers | length
      - (item.tls_cert | length > 0) == (item.tls_key | length > 0)
    fail_msg: >-
      {{ item.name }}: remote_callers want remote: true, and each a name
      starting remote-, the key_sha256 its host printed, a list of repos and
      a list `from` of the addresses or networks it connects from. tls_cert
      and tls_key go together.
    quiet: true
  loop: "{{ executor_merged }}"
  loop_control:
    label: "{{ item.name | default('-') }}"

- name: Find what is wrong with each instance's secrets
  ansible.builtin.set_fact:
    executor_secrets_problems: >-
      {%- set problems = [] -%}
      {%- for instance in executor_merged -%}
      {%-   set values = (instance.secrets | default({})).get('values', {}) -%}
      {%-   set grants = (instance.secrets | default({})).get('repositories', {}) -%}
      {%-   if values is not mapping or grants is not mapping -%}
      {%-     set _ = problems.append(instance.name ~ ': secrets.values and secrets.repositories are mappings') -%}
      {%-   else -%}
      {%-     for name, value in values.items() -%}
      {%-       if name is not match('^[a-z][a-z0-9_]{0,31}$') -%}
      {%-         set _ = problems.append(instance.name ~ ': secret name ' ~ name ~ ' is not lowercase letters, digits and _') -%}
      {%-       elif value is not string or value | length < 8 or value | length > 4096 -%}
      {%-         set _ = problems.append(instance.name ~ ': secret ' ~ name ~ ' is not a string of 8 to 4096 characters') -%}
      {%-       elif value is search("[\\n\\r\\x00']") -%}
      {%-         set _ = problems.append(instance.name ~ ': secret ' ~ name ~ ' has a newline or a quote') -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-     for repo, names in grants.items() -%}
      {%-       if repo is not match('^[A-Za-z0-9-]+/[A-Za-z0-9._-]+$') or names is string or names is mapping or names is not iterable -%}
      {%-         set _ = problems.append(instance.name ~ ': secrets.repositories maps owner/name to a list of names, not ' ~ repo) -%}
      {%-       else -%}
      {%-         for name in names if name not in values -%}
      {%-           set _ = problems.append(instance.name ~ ': ' ~ repo ~ ' is given ' ~ name ~ ', which has no value') -%}
      {%-         endfor -%}
      {%-       endif -%}
      {%-     endfor -%}
      {%-   endif -%}
      {%- endfor -%}
      {{- problems -}}
  no_log: true

- name: Assert every instance's secrets are named and set
  ansible.builtin.assert:
    that: executor_secrets_problems | length == 0
    fail_msg: "{{ executor_secrets_problems }}"
    quiet: true

- name: Assert the instances share no name and no port
  vars:
    executor_all_ports: >-
      {{ executor_merged | map(attribute='ports_start') | map('int')
         | zip(executor_merged | map(attribute='ports_end') | map('int'))
         | map('join', '-') | list }}
    executor_port_lists: >-
      {%- set ports = [] -%}
      {%- for instance in executor_merged -%}
      {%- set _ = ports.extend(range(instance.ports_start | int, instance.ports_end | int + 1)) -%}
      {%- endfor -%}
      {{- ports -}}
  ansible.builtin.assert:
    that:
      - executor_merged | map(attribute='name') | unique | length == executor_merged | length
      - executor_port_lists | unique | length == executor_port_lists | length
    fail_msg: "Two instances share a name or a port: {{ executor_all_ports }}"
    quiet: true

- name: Install what the stacks are built with
  when:
    - install_dependencies | default(true) | bool
    - executor_instances | length > 0
  ansible.builtin.apt:
    name: "{{ executor_packages }}"
    state: present
    update_cache: true
    cache_valid_time: 3600
  become: true

# Root's, so no account can rewrite what its units run.
- name: Install the front and the agent
  ansible.builtin.copy:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "0755"
  loop:
    - {src: front/executor_front.py, dest: "{{ executor_front_bin }}"}
    - {src: agent/executor_agent.py, dest: "{{ executor_agent_bin }}"}
  loop_control:
    label: "{{ item.dest }}"
  become: true

- name: Set up each instance
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ executor_merged }}"
  loop_control:
    loop_var: executor_instance
    label: "{{ executor_instance.name }}"
