---
# Registers callers of the instances on this host, for the roles whose
# sessions call one, after this role has set the instances up:
#
#   - ansible.builtin.include_role:
#       name: joonalai.hostkit.executor
#       tasks_from: callers
#     vars:
#       executor_callers_prefix: runner-
#       executor_callers:
#         - instance: stacks
#           name: runner-app-1          # starts with the prefix
#           uid: 2001                   # the only uid that may use its key
#           repos: [example/app]        # what it may bring up
#           waits: true                 # a job waits for a place; a person does not
#           env_file: /home/coder/claude/app-1/stack.env
#           env_owner: root
#           env_group: coder
#           env_mode: "0640"
#           local_host: host.containers.internal
#           socket: /run/stack.sock     # optional, where the unit mounts api.sock
#
# Each caller gets a key, made on the host and kept by root, and an env
# file with the key and what `stack` needs, for the caller's unit to hand
# its container. The instance keeps only the key's SHA-256. A caller of
# the prefix that is no longer listed loses its registration and its key,
# on every instance of the host, and the instance's reaper takes its stack
# down at once, running or stopped, volumes and tree with it.
#
# An instance in executor_remote_instances is on another host: its
# callers' keys are made and kept here all the same, and the play prints
# each one's SHA-256 for the instance's inventory (remote_callers). The
# key never leaves this host.

- name: Name the remote instances the callers may use
  ansible.builtin.set_fact:
    executor_remote_names: "{{ executor_remote_instances | map(attribute='name') | list }}"

- name: Assert every remote instance has a URL and a certificate to pin
  ansible.builtin.assert:
    that:
      - item.name | default('') is match('^[a-z][a-z0-9]{0,15}$')
      - item.url | default('') is match('^tls://[A-Za-z0-9.:\\[\\]-]+:[0-9]+$')
      - item.tls_sha256 | default('') | replace(':', '') | lower is match('^[0-9a-f]{64}$')
    fail_msg: >-
      A remote instance is a name, its url, tls://host:port, and tls_sha256,
      the SHA-256 its own play printed.
    quiet: true
  loop: "{{ executor_remote_instances }}"
  loop_control:
    label: "{{ item.name | default(item) }}"

- name: Look for the instances the callers name
  ansible.builtin.stat:
    path: "{{ executor_config_dir }}/{{ item }}/instance.json"
  loop: "{{ executor_callers | map(attribute='instance') | unique | reject('in', executor_remote_names) | list }}"
  register: executor_callers_instances
  become: true

# A first dry run of a play that sets up the executor and its callers
# together has no instance yet to register with.
- name: Stop a dry run that has no instance to register with
  when:
    - ansible_check_mode
    - executor_callers_instances.results | rejectattr('stat.exists') | list | length > 0
  ansible.builtin.meta: end_role

- name: Assert every instance named is on this host
  ansible.builtin.assert:
    that: item.stat.exists
    fail_msg: >-
      A repository names the executor instance {{ item.item }}, which is not
      on this host: list it in executor_instances and run the executor role
      before this one, or, on another host, in executor_remote_instances.
    quiet: true
  loop: "{{ executor_callers_instances.results }}"
  loop_control:
    label: "{{ item.item }}"

- name: Assert every caller is named for its role
  ansible.builtin.assert:
    that:
      - item.name is match('^[a-z0-9][a-z0-9-]{0,62}$')
      - item.name.startswith(executor_callers_prefix)
      - item.repos is not string
    fail_msg: "{{ item.name }}: a caller is a name of lowercase letters, digits and dashes starting {{ executor_callers_prefix }}."
    quiet: true
  loop: "{{ executor_callers }}"
  loop_control:
    label: "{{ item.name }}"

# A remote instance's keys are kept apart from any local one's, by a
# name no instance can have.
- name: Make the key directories of the remote instances
  ansible.builtin.file:
    path: "{{ executor_config_dir }}/remote-instances/{{ item }}/keys"
    state: directory
    owner: root
    group: root
    mode: "0700"
  loop: "{{ executor_callers | map(attribute='instance') | select('in', executor_remote_names) | unique | list }}"
  become: true

# Made once, kept: a caller's key changes only when it is removed.
- name: Make each caller's key
  ansible.builtin.command:
    argv:
      - python3
      - -c
      - |
        import os, secrets, sys
        fd = os.open(sys.argv[1], os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
        os.write(fd, secrets.token_urlsafe(32).encode())
        os.close(fd)
      - "{{ executor_config_dir }}/{{ ('remote-instances/' if item.instance in executor_remote_names else '') ~ item.instance }}/keys/{{ item.name }}"
    creates: "{{ executor_config_dir }}/{{ ('remote-instances/' if item.instance in executor_remote_names else '') ~ item.instance }}/keys/{{ item.name }}"
  loop: "{{ executor_callers }}"
  loop_control:
    label: "{{ item.instance }}/{{ item.name }}"
  become: true

- name: Read the callers' keys
  when: not ansible_check_mode
  ansible.builtin.slurp:
    src: "{{ executor_config_dir }}/{{ ('remote-instances/' if item.instance in executor_remote_names else '') ~ item.instance }}/keys/{{ item.name }}"
  loop: "{{ executor_callers }}"
  loop_control:
    label: "{{ item.instance }}/{{ item.name }}"
  register: executor_callers_keys
  no_log: true
  become: true

- name: Register each caller with its instance
  when:
    - not ansible_check_mode
    - item.0.instance not in executor_remote_names
  ansible.builtin.copy:
    content: >-
      {{ {'key_sha256': item.1.content | b64decode | hash('sha256'),
          'uid': item.0.uid | int,
          'repos': item.0.repos,
          'waits': item.0.waits | default(false) | bool}
         | to_nice_json }}
    dest: "{{ executor_config_dir }}/{{ item.0.instance }}/callers/{{ item.0.name }}.json"
    owner: root
    group: "{{ item.0.instance }}-executor"
    mode: "0640"
  loop: "{{ executor_callers | zip(executor_callers_keys.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.instance }}/{{ item.0.name }}"
  no_log: true
  become: true

# The key goes to the caller only through its own unit's environment.
- name: Write each caller's environment
  when: not ansible_check_mode
  ansible.builtin.copy:
    content: |
      STACK_KEY={{ item.1.content | b64decode }}
      STACK_REPO={{ item.0.repos | first }}
      {% if item.0.instance in executor_remote_names %}
      {% set remote = executor_remote_instances | selectattr('name', 'equalto', item.0.instance) | first %}
      STACK_URL={{ remote.url }}
      STACK_TLS_SHA256={{ remote.tls_sha256 | replace(':', '') | lower }}
      {% else %}
      STACK_SOCKET={{ item.0.socket | default('/run/stack.sock') }}
      STACK_LOCAL_HOST={{ item.0.local_host | default('') }}
      {% endif %}
    dest: "{{ item.0.env_file }}"
    owner: "{{ item.0.env_owner | default('root') }}"
    group: "{{ item.0.env_group | default('root') }}"
    mode: "{{ item.0.env_mode | default('0640') }}"
  loop: "{{ executor_callers | zip(executor_callers_keys.results | default([])) | list }}"
  loop_control:
    label: "{{ item.0.env_file }}"
  no_log: true
  become: true

# Public, for the instance's inventory: its remote_callers entries, as
# they are pasted there. The name is the instance's, remote- with this
# host's and the caller's, so two callers' hosts never collide on one
# instance; only `from` is left to add, which this host cannot know.
- name: Find what each remote instance needs of its callers
  when: not ansible_check_mode
  vars:
    executor_remote_host: "{{ inventory_hostname_short | lower | regex_replace('[^a-z0-9-]', '-') | truncate(16, true, '') }}"
  ansible.builtin.set_fact:
    executor_remote_registrations: >-
      {%- set found = {} -%}
      {%- for caller, key in executor_callers | zip(executor_callers_keys.results | default([])) -%}
      {%-   if caller.instance in executor_remote_names -%}
      {%-     set _ = found.setdefault(caller.instance, []).append({
                'name': ('remote-' ~ executor_remote_host ~ '-' ~ caller.name)[:63],
                'key_sha256': key.content | b64decode | hash('sha256'),
                'repos': caller.repos,
                'waits': caller.waits | default(false) | bool}) -%}
      {%-   endif -%}
      {%- endfor -%}
      {{- found -}}
  no_log: true

- name: Say what each remote instance's remote_callers want
  when:
    - not ansible_check_mode
    - executor_remote_registrations | length > 0
  ansible.builtin.debug:
    msg:
      paste: >-
        Add each instance's entries to its remote_callers on its host, each
        with `from`, the addresses this host connects from.
      remote_callers: "{{ executor_remote_registrations }}"

# A host with no executor has nothing to prune, and no directory to look in.
- name: Look for the instances' configuration
  ansible.builtin.stat:
    path: "{{ executor_config_dir }}"
  register: executor_callers_config_dir
  become: true

- name: Find the registrations of the prefix's callers
  when: executor_callers_config_dir.stat.exists
  ansible.builtin.find:
    paths: "{{ executor_config_dir }}"
    recurse: true
    patterns: "{{ executor_callers_prefix }}*"
  register: executor_callers_found
  become: true

- name: Remove the callers no longer listed, with their keys
  vars:
    executor_callers_wanted: >-
      {{ executor_callers | map(attribute='instance') | zip(executor_callers | map(attribute='name'))
         | map('join', '/') | list }}
    executor_found_kind: "{{ item.path | dirname | basename }}"
    executor_found_caller: >-
      {{ item.path | dirname | dirname | basename }}/{{ item.path | basename | regex_replace('\.json$', '') }}
  when:
    - executor_found_kind in ['callers', 'keys']
    - executor_found_caller not in executor_callers_wanted
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: absent
  loop: "{{ executor_callers_found.files | default([]) }}"
  loop_control:
    label: "{{ item.path }}"
  register: executor_callers_removed
  become: true

# A caller that moved to another instance, or went, may leave a stack
# here, running or stopped, that nothing could take down any more. The
# reaper takes it now, with its volumes and tree, and frees its ports,
# rather than at its next quarter hour; until then `list` and the page
# already leave it out.
- name: Take down the stacks of the callers removed
  when: executor_callers_pruned | length > 0
  vars:
    executor_callers_pruned: >-
      {{ executor_callers_removed.results | default([]) | selectattr('changed')
         | map(attribute='item.path') | select('search', '/callers/[^/]+[.]json$')
         | map('dirname') | map('dirname') | map('basename') | unique | list }}
  ansible.builtin.systemd_service:
    name: "executor-{{ item }}-reap.service"
    state: started
  loop: "{{ executor_callers_pruned }}"
  become: true

- name: Say which callers were removed, with their stacks
  when: executor_callers_gone | length > 0
  vars:
    executor_callers_gone: >-
      {{ executor_callers_removed.results | default([]) | selectattr('changed')
         | map(attribute='item.path') | select('search', '/callers/[^/]+[.]json$')
         | map('regex_replace', '^.*/([^/]+)/callers/([^/]+)[.]json$', '\g<1>/\g<2>') | list }}
  ansible.builtin.debug:
    msg: >-
      Removed {{ executor_callers_gone | join(', ') }}: no longer listed, each
      with its stack, its volumes and its tree, and its ports freed.
